syntax = "proto2";
package k6bus.security;
option optimize_for = SPEED;

// ---------------------------------------------------------------------
// Supported algorithms
// ---------------------------------------------------------------------
// 2026-09-01: AES-256-CBC was dropped (malleable without a MAC and with no
// support in Zig's std.crypto); slot 3 stays reserved. CRYPTO_CUSTOM lets
// you inject your own compiled implementation (same convention as
// TransportKind.CUSTOM = 100), without dlopen for now.
// ---------------------------------------------------------------------
enum CryptoMode {
    CRYPTO_NONE              = 0;
    CRYPTO_AES_256_GCM       = 1;
    CRYPTO_CHACHA20_POLY1305 = 2;
    // 3: reserved (AES-256-CBC dropped)
    CRYPTO_CUSTOM            = 100;
}

// ---------------------------------------------------------------------
// Key record
// ---------------------------------------------------------------------
// version: format contract (optional; no commercial compatibility).
// mode: REQUIRED - explicit which cipher was used (the generator writes it).
// key_id: REQUIRED - identifies the key (future rotation).
// key: REQUIRED - always in Base64 text.
// iv: removed - GCM/ChaCha use a random nonce per message.
//
// Life cycle (2026-09-07):
// - Every key is born with a validity window [created_on, expires_on].
// - created_on: REQUIRED - start of validity, ISO 8601 UTC
//   (e.g. 2026-09-07T18:00:00Z). The key is NOT valid before that instant.
// - expires_on: REQUIRED - end of validity, ISO 8601 UTC. The key is NOT
//   valid from that instant. MANDATORY: plan rotation when generating.
// - Constraints: expires_on > created_on; both in UTC. ISO 8601 in string:
//   readable in the file and lexicographic order = chronological order.
// - Verification IN PROGRESS (reject expired keys at load time and warn
//   near expiry) will be implemented in LoadCipher once the key manager
// exists. No manual revocation (status/revoked_on) for now: expiry is the
//   automatic invalidation.
// ---------------------------------------------------------------------

message KeyRecord {
    optional uint32 version = 1 	[default = 1];
    optional string description = 2;
    required CryptoMode mode = 3;
    required uint32 key_id = 4;

    // Always stored in Base64 text.
    required string key = 5;

    // Validity window (ISO 8601 UTC).
    required string created_on = 6;
    required string expires_on = 7;
}

// ---------------------------------------------------------------------
// Key registry (2026-09-10)
// ---------------------------------------------------------------------
// A single registry file (ZON format for now, e.g.
// sec/k6bus.lab.zon.keyreg) holds N KeyRecord. The domain picks which one
// to use with DomainConfig.key_registry_file + key_id.
// version and description are MANDATORY in the registry (in KeyRecord they
// stay optional): the registry declares its format contract and which
// environment it is for (lab / prod / ...).
// No compatibility with earlier versions (we are still on v1).
// ---------------------------------------------------------------------

message KeyRegistry {
    required uint32 version = 1;
    required string description = 2;
    repeated KeyRecord keys = 3;
}
