version: 1
activate_trace: true
trace_level: 2
domains {
    id: 77
    activate_default_transport: false
    direct_dispatch_to_subs: false
    binary_format: BF_PROTOBUF
    start_at_init: true
    dispatch_mode: IMMEDIATE
    dispatch_batch_time_ms: 0
    transports {
        name: "mcast-main"
        kind: MCAST
        encoding: RAW
    }
    transports {
        name: "bcast-main"
        kind: BCAST
        encoding: RAW
    }
    transports {
        name: "udpstar-main"
        kind: UDPSTAR
        encoding: RAW
    }
    transports {
        name: "usoxstar-main"
        kind: USOXSTAR
        encoding: RAW
    }
    cross_connectors {
        transports: "mcast-main"
        transports: "bcast-main"
        transports: "udpstar-main"
        transports: "usoxstar-main"
    }
}
