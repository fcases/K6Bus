version: 1
activate_trace: true
trace_level: 2
domains {
    id: 77
    activate_default_transport: false
    direct_dispatch_to_subs: false
    binary_format: BF_PROTOBUF
    start_at_init: true
    dispatch_mode: IMMEDIATE
    dispatch_batch_time_ms: 0
    transports {
        name: "mcast-main"
        kind: MCAST
        encoding: RAW
        mcast {
            local_address: "Any"
            mcast_address: "239.255.0.1"
            port: 40069
            ttl: 1
            receive_buffer: 134217727
            send_buffer: 134217727
        }
    }
    transports {
        name: "bcast-main"
        kind: BCAST
        encoding: RAW
        bcast {
            local_address: "Any"
            bcast_address: "255.255.255.255"
            port: 40070
            receive_buffer: 134217727
            send_buffer: 134217727
        }
    }
    transports {
        name: "udpstar-main"
        kind: UDPSTAR
        encoding: RAW
        udpstar {
            local_address: "Any"
            port: 40071
            end_point {
                host: "127.0.0.1"
                port: 40072
            }
            end_point {
                host: "127.0.0.1"
                port: 40073
            }
            receive_buffer: 134217727
            send_buffer: 134217727
        }
    }
    transports {
        name: "usoxstar-main"
        kind: USOXSTAR
        encoding: RAW
        usoxstar {
            local_socket_path: "/tmp/k6bus-main.sock"
            remote_socket_paths: "/tmp/k6bus-node-a.sock"
            remote_socket_paths: "/tmp/k6bus-node-b.sock"
            receive_buffer: 134217727
            send_buffer: 134217727
        }
    }
    transports {
        name: "string-main"
        kind: CUSTOM
        encoding: RAW
        texto: "hola"
    }
    transports {
        name: "uint-main"
        kind: CUSTOM
        encoding: RAW
        codigo: 33
    }
    transports {
        name: "bool-main"
        kind: CUSTOM
        encoding: RAW
        activo: true
    }
    transports {
        name: "test-bytes"
        kind: CUSTOM
        encoding: RAW
        raw: "SG9sYSBLNkJ1cw=="
    }
    transports {
        name: "enum-main"
        kind: CUSTOM
        encoding: RAW
        tipo_dato: DATO_B
    }
    cross_connectors {
        transports: "mcast-main"
        transports: "bcast-main"
        transports: "udpstar-main"
        transports: "usoxstar-main"
    }
}
