syntax = "proto2";

package demo4;

message Cia {
    required string name =1; 
    required string ubicacion = 2;
    required float pos_x = 3;
    required float pos_y = 4;
}

message Bon {
    required string name =1; 
    required string ubicacion = 2;
    required float pos_x = 3;
    required float pos_y = 4;
	repeated Cia cia = 5;
}
